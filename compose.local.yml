services:
  redis:
    image: redis:alpine
    command: redis-server --maxmemory-policy noeviction --appendonly yes --appendfsync everysec
    restart: always
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    restart: always
    depends_on:
      - redis
    ports:
      - "2000:3000"
    volumes:
      - files-data:/files
      - /usr/local/gromacs:/gromacs:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://192.168.1.99:2000
    env_file: .env
    restart: always
    ports:
      - "1000:3000"

volumes:
  redis-data:
    driver: nfsvol
  files-data:
    driver: nfsvol
