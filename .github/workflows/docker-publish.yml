name: Publish Docker Images

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main, next]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and Push
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
          - app: web
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: tag
        if: github.event_name == 'workflow_run'
        run: |
          git fetch --tags --force
          TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.' | head -1)
          echo "value=$TAG" >> $GITHUB_OUTPUT
          if echo "$TAG" | grep -q '-'; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/visualdynamics-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.value }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' && steps.tag.outputs.prerelease == 'false' }}
            type=raw,value=beta,enable=${{ github.event_name == 'workflow_run' && steps.tag.outputs.prerelease == 'true' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set API URL
        id: api-url
        if: matrix.app == 'web'
        run: |
          if [[ "${{ steps.tag.outputs.prerelease }}" == "true" ]]; then
            echo "value=${{ vars.VITE_API_BASE_URL_HMG }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ vars.VITE_API_BASE_URL }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.app == 'web' && format('VITE_API_BASE_URL={0}', steps.api-url.outputs.value) || '' }}
          no-cache: true
          provenance: false
